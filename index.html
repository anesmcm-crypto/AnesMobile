<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnesSecurity - Hacker Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .install-banner {
            background-color: #00ff66;
            color: #000;
            width: 100%;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            position: fixed;
            top: 0;
            box-shadow: 0 2px 10px rgba(0,255,102,0.5);
        }
        .logo-container {
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px #00ff66;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-top: 60px;
            margin-bottom: 20px;
            background-color: #111827;
        }
        .logo-container h2 {
            color: #00ff66;
            margin: 10px 0 0 0;
            text-shadow: 0 0 10px #00ff66;
        }
        .shield-icon {
            font-size: 40px;
        }
        .card {
            background-color: #111827;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0,255,102,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h3 {
            color: #00ff66;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #00ff66;
            background-color: #0b0f19;
            color: #00ff66;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input::placeholder {
            color: #008833;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-login {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        .btn-login:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div class="install-banner">
        📱 تثبيت تطبيق AnesSecurity على جهازك
    </div>

    <div class="logo-container">
        <div class="shield-icon">🛡️</div>
        <h2>أمان</h2>
    </div>

    <div class="card">
        <h3>تسجيل الدخول 🔒</h3>

        <div class="input-group">
            <input type="text" placeholder="اسم المستخدم أو البريد">
        </div>
        <div class="input-group">
            <input type="password" placeholder="كلمة المرور">
        </div>

        <div class="btn-container">
            <button class="btn-login">دخول النظام</button>
        </div>
    </div>

</body>
</html>
