<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnesSecurity - Hacker Portal</title>
    <style>
        /* تصميم عام للصفحة */
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19; /* لون خلفية قاتم */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* شريط التثبيت الفوقي */
        .install-banner {
            background-color: #00ff66; /* لون أخضر ساطع */
            color: #000;
            width: 100%;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            position: fixed; /* يثبت الشريط في الأعلى */
            top: 0;
            left: 0;
            z-index: 1000; /* يجعله فوق كل العناصر */
            box-shadow: 0 2px 10px rgba(0,255,102,0.5);
            cursor: pointer;
        }
        .install-banner:hover {
            background-color: #00cc52;
        }

        /* حاوية اللوغو */
        .logo-container {
            margin-top: 80px; /* مسافة تحت البانر */
            margin-bottom: 30px;
            text-align: center;
        }
        .logo-shield {
            width: 150px; /* حجم اللوغو */
            height: auto;
            filter: drop-shadow(0 0 15px #00ff66); /* تأثير توهج للوغو */
        }

        /* بطاقة تسجيل الدخول */
        .login-card {
            background-color: #111827;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ff66; /* إطار أخضر */
            box-shadow: 0 0 25px rgba(0,255,102,0.3); /* توهج للبطاقة */
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h3 {
            color: #00ff66;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #00ff66;
            background-color: #0b0f19;
            color: #00ff66;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
        }
        input::placeholder {
            color: #008833;
        }

        /* الأزرار */
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-login {
            background-color: #00ff66;
            color: #000;
            box-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        .btn-login:hover {
            background-color: #00cc52;
            box-shadow: 0 0 15px rgba(0,255,102,0.6);
        }

        .btn-register {
            background-color: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
        }
        .btn-register:hover {
            background-color: rgba(0,255,102,0.1);
        }

        /* تنبيه ويندوز (محاكي) */
        .windows-alert {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: none; /* مخفي افتراضياً */
            animation: slideIn 0.5s ease;
            z-index: 1001;
        }
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .windows-alert p {
            margin: 0 0 10px 0;
            color: #c9d1d9;
            font-size: 14px;
        }
        .windows-alert button {
            width: 100%;
            background-color: #1f6feb;
            color: white;
            padding: 8px;
        }
        .windows-alert button:hover {
            background-color: #388bfd;
        }
    </style>
</head>
<body>

    <!-- زر التثبيت الحقيقي (عند الضغط عليه يحاكي تحميل ملف) -->
    <div class="install-banner" id="installBtn">
        📱 تحميل وتثبيت تطبيق AnesSecurity على جهازك
    </div>

    <!-- اللوغو (الشعار) الجديد -->
    <div class="logo-container">
        <img src="logo.png" alt="AnesSecurity Logo" class="logo-shield">
    </div>

    <!-- بطاقة تسجيل الدخول وإنشاء الحساب -->
    <div class="login-card">
        <h3>بوابة الدخول الأمنية 🔒</h3>
        <div class="input-group">
            <input type="text" placeholder="اسم المستخدم أو البريد">
        </div>
        <div class="input-group">
            <input type="password" placeholder="كلمة المرور">
        </div>
        <div class="btn-container">
            <button class="btn-login">دخول النظام</button>
            <button class="btn-register">إنشاء حساب</button>
        </div>
    </div>

    <!-- محاكي رسالة ويندوز عند بدء التثبيت -->
    <div class="windows-alert" id="windowsAlert">
        <p>تم بدء تحميل الملف: AnesSecurity_Installer.exe</p>
        <button onclick="closeAlert()">حسناً</button>
    </div>

    <script>
        // وظيفة لزر التثبيت
        document.getElementById('installBtn').addEventListener('click', function() {
            // هذه محاكاة لتحميل الملف
            const link = document.createElement('a');
            link.href = 'data:text/plain;charset=utf-8,This_is_a_mock_installer_file'; // رابط ملف وهمي
            link.download = 'AnesSecurity_Installer.exe';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // إظهار رسالة المحاكاة
            document.getElementById('windowsAlert').style.display = 'block';
        });

        // وظيفة لإغلاق التنبيه
        function closeAlert() {
            document.getElementById('windowsAlert').style.display = 'none';
        }
    </script>

</body>
</html>
