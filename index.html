<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnesMobile - إنشاء حساب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #16a34a;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إنشاء حساب جديد</h2>
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="example@gmail.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button id="registerBtn">تسجيل حساب</button>
        <p id="message"></p>
    </div>

    <!-- كود فايربيز الخاص بك -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjI4Mi_jSfBjF9ASeIYVvr-s8JRwVF-sA",
            authDomain: "anessecurity.firebaseapp.com",
            projectId: "anessecurity",
            storageBucket: "anessecurity.firebasestorage.app",
            messagingSenderId: "1032536820198",
            appId: "1:1032536820198:web:81bc852692126af67dee27",
            measurementId: "G-NC6WE479E1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const registerBtn = document.getElementById('registerBtn');
        const message = document.getElementById('message');

        registerBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(!email || !password) {
                message.style.color = '#ef4444';
                message.innerText = 'الرجاء ملء جميع الخانات!';
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    message.style.color = '#22c55e';
                    message.innerText = 'تم إنشاء الحساب بنجاح! مبروك 🎉';
                })
                .error = (error) => {};
                
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Success
                })
                .catch((error) => {
                    message.style.color = '#ef4444';
                    message.innerText = 'خطأ: ' + error.message;
                });
        });
    </script>
</body>
</html>
